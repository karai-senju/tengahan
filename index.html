<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tengahan — cari titik tengah untuk nongkrong</title>
  <meta name="description" content="Cari titik tengah rumah teman-teman, lalu temukan tempat nongkrong di dekatnya.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./src/ui/places.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Each feature is its own module; add one line per feature. -->
  <script type="module" src="./src/ui/map.js"></script>
  <script type="module" src="./src/ui/places.js"></script>
  <script type="module" src="./src/ui/peserta.js"></script>
  <script type="module" src="./src/ui/search.js"></script>
  <script type="module" src="./src/ui/bagikan.js"></script>
</head>
<body>
  <main class="layout">
    <div id="map" role="region" aria-label="Peta"></div>
    <div class="panel">
      <header>
        <h1>Tengahan</h1>
        <p class="tagline">Cari titik tengah rumah kalian, lalu nongkrong di dekatnya.</p>
      </header>
      <p id="hint" role="status" aria-live="polite"></p>
      <section aria-labelledby="peserta-judul">
        <h2 id="peserta-judul">Peserta</h2>
        <ol id="peserta-list" class="peserta-list"></ol>
        <button id="tambah-orang" class="tambah" type="button">+ Tambah orang</button>
      </section>
      <section id="places" aria-label="Tempat Nongkrong"></section>
    </div>
  </main>
</body>
</html>
